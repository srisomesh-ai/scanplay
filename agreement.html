<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>ScanPlay Agreement</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F3F1FA;font-family:'Plus Jakarta Sans',system-ui,sans-serif}.page{max-width:820px;margin:20px auto;background:#fff;padding:36px 40px;border-radius:14px;box-shadow:0 10px 30px rgba(20,16,50,.08)}
.bar{max-width:820px;margin:16px auto 0;display:flex;gap:8px;justify-content:flex-end}.bar button{padding:10px 16px;border-radius:999px;border:0;background:#7C3AED;color:#fff;font:700 14px 'Plus Jakarta Sans';cursor:pointer}
@media print{body{background:#fff}.page{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}.bar{display:none}}</style>
<script src="agreement.js"></script></head><body>
<div class="bar"><button onclick="window.print()">Download / Print PDF</button></div>
<div class="page" id="doc">Loading…</div>
<script>
const st=document.createElement('style'); st.textContent=AGR_CSS; document.head.appendChild(st);
(async()=>{ const id=new URLSearchParams(location.search).get('id'); const h={}; const a=sessionStorage.getItem('sp_admin'), t=localStorage.getItem('sp_token');
  if(a) h['X-Admin-Pass']=a; if(t) h['X-Token']=t;
  const k=new URLSearchParams(location.search).get('k')||''; const r=await (await fetch('api.php?action=agreement_get&id='+encodeURIComponent(id)+(k?'&k='+encodeURIComponent(k):''),{headers:h})).json();
  document.getElementById('doc').innerHTML=r.ok?agreementHtml(r.agreement):'<p>'+(r.error||'Could not load')+'</p><p style="font-size:13px;color:#5B5670">Open this agreement from your Partner panel in the Studio, or from the link in your email.</p>';
  if(r.ok) document.title='ScanPlay Agreement '+r.agreement.id;
})();
</script></body></html>
