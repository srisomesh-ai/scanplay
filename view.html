<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ScanPlay</title>
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/scanplay-logo.svg"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
  #scene{position:fixed;inset:0}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:#000;z-index:5;transition:opacity .3s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font:600 22px Sora;letter-spacing:-.02em;margin:0 0 8px}
  .ov p{color:#A9B1BA;font-size:14px;margin:0 0 22px;line-height:1.5;max-width:300px}
  .btn{background:linear-gradient(135deg,#7C3AED,#FF4D6D);color:#fff;border:0;border-radius:999px;padding:14px 28px;font:500 15px Inter;cursor:pointer}
  #snd{position:fixed;top:18px;right:18px;z-index:6;background:rgba(16,20,24,.72);backdrop-filter:blur(8px);color:#fff;border:0;border-radius:999px;padding:9px 14px;font:500 13px Inter}
  #hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(16,20,24,.72);backdrop-filter:blur(8px);padding:10px 18px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:4;white-space:nowrap}
  #hint i{width:8px;height:8px;border-radius:50%;background:#F2A93B;animation:pulse 1.2s infinite}
  #hint.found i{background:#3ED598;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #brand{position:fixed;top:18px;left:18px;z-index:6;text-decoration:none;color:#fff;font:600 12px Inter;background:rgba(16,20,24,.6);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:8px}
  #brand img{height:22px;border-radius:4px}
  #brand.wm{background:rgba(255,77,109,.85)}
  .mindar-ui-overlay{display:none!important}
</style>
</head>
<body>

<div class="ov" id="intro"><h1>Starting camera…</h1><p>Allow camera access when asked.</p></div>
<div class="ov hide" id="errOv"><h1>Can't start</h1><p id="errMsg"></p><button class="btn" onclick="location.reload()">Try again</button></div>

<button id="snd" style="display:none">🔇 Tap for sound</button>
<a id="brand" href="https://scanplay.in" target="_blank" rel="noopener" style="display:none"></a>
<div id="hint" style="display:none"><i></i><span>Point at the picture</span></div>
<div id="scene"></div>

<script>
/* Stabiliser: the video rides on a separate entity that follows the tracked target with adaptive smoothing.
   Small jitter -> heavy smoothing (no shake). Big moves -> fast follow (no lag). Holds through brief drops. */
AFRAME.registerComponent('sp-stable',{
  schema:{target:{type:'selector'},minA:{default:0.10},maxA:{default:0.85},gain:{default:6},hold:{default:900}},
  init(){ this.p=new THREE.Vector3(); this.q=new THREE.Quaternion(); this.s=new THREE.Vector3(1,1,1); this.tp=new THREE.Vector3(); this.tq=new THREE.Quaternion(); this.ts=new THREE.Vector3(); this.has=false; this.seen=false; this.lastSeen=0; this.stable=0; this.el.object3D.visible=false;
    this.data.target.addEventListener('targetFound',()=>{ this.seen=true; }); this.data.target.addEventListener('targetLost',()=>{ this.seen=false; }); },
  tick(t,dt){
    const tgt=this.data.target.object3D; if(!tgt) return;
    if(this.seen&&tgt.visible){ tgt.updateMatrixWorld(true); tgt.matrixWorld.decompose(this.tp,this.tq,this.ts); this.lastSeen=t;
      if(!this.has){ this.p.copy(this.tp); this.q.copy(this.tq); this.s.copy(this.ts); this.has=true; this.stable=0; }
      const dist=this.p.distanceTo(this.tp); const a=Math.min(this.data.maxA,Math.max(this.data.minA,this.data.minA+dist*this.data.gain));
      this.p.lerp(this.tp,a); this.q.slerp(this.tq,a); this.s.lerp(this.ts,a);
      this.stable=Math.min(this.stable+dt,1000); if(this.stable>120) this.el.object3D.visible=true;
    } else if(this.has && t-this.lastSeen>this.data.hold){ this.el.object3D.visible=false; this.has=false; }
    if(this.has){ const o=this.el.object3D; o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s); }
  }
});
const code=(new URLSearchParams(location.search).get('c')||'').replace(/[^a-z0-9]/g,'');
const $=s=>document.querySelector(s);
function fail(m){ $('#intro').classList.add('hide'); $('#errMsg').textContent=m; $('#errOv').classList.remove('hide'); }

async function init(){
  if(!code) return fail('This link is missing an account code.');
  const r=await fetch(`api.php?action=get&c=${code}`).then(x=>x.json()).catch(()=>({ok:false,error:'Network error'}));
  if(!r.ok) return fail(r.error||'Account not found');
  if(!r.items.length) return fail('This account has no pictures yet.');
  document.title=r.name;
  const b=$('#brand');
  if(r.logo){ b.innerHTML=`<img src="${r.logo}" alt="">`; b.href='#'; b.onclick=e=>e.preventDefault(); b.style.display='flex'; }
  else if(r.watermark){ b.textContent='Made with ScanPlay · Free trial'; b.classList.add('wm'); b.style.display='flex'; }
  start(r);
}

// Size + texture mapping of the video plane relative to the target (width 1, height R)
function fit(R,VR,mode){
  if(mode==='fit')     return VR>R ? {w:R/VR,h:R,rep:'1 1',off:'0 0'} : {w:1,h:VR,rep:'1 1',off:'0 0'};
  if(mode==='stretch') return {w:1,h:R,rep:'1 1',off:'0 0'};
  // fill: plane = target, crop the video texture to cover
  if(VR>R){ const k=R/VR; return {w:1,h:R,rep:`1 ${k.toFixed(4)}`,off:`0 ${((1-k)/2).toFixed(4)}`}; }
  const k=VR/R;          return {w:1,h:R,rep:`${k.toFixed(4)} 1`,off:`${((1-k)/2).toFixed(4)} 0`};
}

function start(acc){
  const assets=acc.items.map((it,i)=>`<video id="v${i}" src="${it.video}" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>`).join('');
  const targets=acc.items.map((it,i)=>{ const f=fit(it.ratio,it.vratio||it.ratio,it.fit||'fit'); return `
      <a-entity mindar-image-target="targetIndex: ${i}" data-i="${i}" id="t${i}"></a-entity>
      <a-entity sp-stable="target: #t${i}">
        <a-video src="#v${i}" width="${f.w}" height="${f.h}" position="0 0 0" material="repeat: ${f.rep}; offset: ${f.off}"></a-video>
      </a-entity>`; }).join('');

  $('#scene').innerHTML=`
    <a-scene mindar-image="imageTargetSrc: ${acc.mind}?v=${Date.now()}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0005; filterBeta: 0.02; missTolerance: 20; warmupTolerance: 2; maxTrack: 1"
             color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
      <a-assets>${assets}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${targets}
    </a-scene>`;

  const scene=$('a-scene'), hint=$('#hint'), snd=$('#snd');
  const vids=acc.items.map((_,i)=>$('#v'+i));
  vids.forEach(v=>v.muted=true);
  snd.style.display='block';
  document.addEventListener('pointerdown',()=>{ vids.forEach(v=>v.muted=false); snd.style.display='none'; },{once:true});

  document.querySelectorAll('[mindar-image-target]').forEach(t=>{
    const i=+t.dataset.i;
    t.addEventListener('targetFound',()=>{ hint.classList.add('found'); hint.lastElementChild.textContent=acc.items[i].title; vids.forEach((v,j)=>{ if(j!==i) v.pause(); }); vids[i].play().catch(()=>{}); });
    let lostT; t.addEventListener('targetLost', ()=>{ hint.classList.remove('found'); hint.lastElementChild.textContent='Point at the picture'; clearTimeout(lostT); lostT=setTimeout(()=>vids[i].pause(),1000); });
    t.addEventListener('targetFound',()=>clearTimeout(lostT));
  });
  scene.addEventListener('arReady',()=>{ $('#intro').classList.add('hide'); hint.style.display='flex'; });
  scene.addEventListener('arError',ev=>fail('Camera could not start. Check permissions and that you are on HTTPS. '+(ev.detail?.error||'')));
}
init();
</script>
</body>
</html>
