<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ScanPlay Player</title>
<meta name="robots" content="noindex">
<meta name="description" content="ScanPlay AR player — point your phone at the printed photo and the video plays on it.">
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/scanplay-logo.svg"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js" integrity="sha384-eN051QCzm3AZaisni7SiETtNXwrXaFERMcH8DNphEB9c0FnfW9snRqWfN8TkbYOb" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" integrity="sha384-kcf/qSrCvp+E61nlypb+jERqjCMK7gpiAp/DLO+HRdq1hcccAtLHyUmK6l8bFMal" crossorigin="anonymous"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
  #scene{position:fixed;inset:0}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:#000;z-index:5;transition:opacity .3s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font:600 22px Sora;letter-spacing:-.02em;margin:0 0 8px}
  .ov p{color:#A9B1BA;font-size:14px;margin:0 0 22px;line-height:1.5;max-width:300px}
  .btn{background:linear-gradient(135deg,#7C3AED,#FF4D6D);color:#fff;border:0;border-radius:999px;padding:14px 28px;font:500 15px Inter;cursor:pointer}
  #snd{position:fixed;top:18px;right:18px;z-index:6;background:rgba(16,20,24,.72);backdrop-filter:blur(8px);color:#fff;border:0;border-radius:999px;padding:9px 14px;font:500 13px Inter}
  #hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(16,20,24,.72);backdrop-filter:blur(8px);padding:10px 18px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:4;white-space:nowrap}
  #hint i{width:8px;height:8px;border-radius:50%;background:#F2A93B;animation:pulse 1.2s infinite}
  #hint.found i{background:#3ED598;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #brand{position:fixed;top:18px;left:18px;z-index:6;text-decoration:none;color:#fff;font:600 12px Inter;background:rgba(16,20,24,.6);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:8px}
  #brand img{height:22px;border-radius:4px}
  #brand.wm{background:rgba(255,77,109,.85)}
  .ytov{position:fixed;left:0;top:0;width:200px;height:112px;z-index:4;display:none;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px #22D3EE,0 20px 50px rgba(0,0,0,.6);background:#000;will-change:transform}
  .ytov iframe{width:100%;height:100%;border:0;display:block}
  .mindar-ui-overlay{display:none!important}
</style>
</head>
<body>

<div class="ov" id="intro"><h1>Starting camera…</h1><p>Allow camera access when asked.</p></div>
<div class="ov hide" id="errOv"><h1>Can't start</h1><p id="errMsg"></p><button class="btn" onclick="location.reload()">Try again</button></div>

<button id="snd" style="display:none">🔇 Tap for sound</button>
<a id="brand" href="https://scanplay.in" target="_blank" rel="noopener" style="display:none"></a>
<div id="hint" style="display:none"><i></i><span>Point at the picture</span></div>
<div id="scene"></div>

<script>

/* YouTube floating player: follows the tracked photo on screen (hover, not fused) */

/* Stabiliser for fused video: adaptive smoothing of the tracked pose, judged in screen pixels.
   Jitter of a few px -> heavy smoothing (rock steady). Real movement -> fast follow (no float). */
AFRAME.registerComponent('sp-stable',{schema:{target:{type:'selector'}},
  init(){ this.p=new THREE.Vector3(); this.q=new THREE.Quaternion(); this.s=new THREE.Vector3(1,1,1); this.tp=new THREE.Vector3(); this.tq=new THREE.Quaternion(); this.ts=new THREE.Vector3(); this.pv=new THREE.Vector3(); this.has=false; this.on=false; this.lostAt=0; this.stableMs=0; this.lastScr=null; this.el.object3D.visible=false;
    this.data.target.addEventListener('targetFound',()=>{this.on=true;}); this.data.target.addEventListener('targetLost',()=>{this.on=false; this.lostAt=performance.now();}); },
  tick(t,dt){ const tgt=this.data.target.object3D, cam=this.el.sceneEl.camera; if(!tgt||!cam) return;
    if(!this.on){ if(this.has && t-this.lostAt>0){ this.el.object3D.visible=false; this.has=false; this.lastScr=null; } else if(this.has){ const o=this.el.object3D; o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s); } return; }
    tgt.updateMatrixWorld(true); tgt.matrixWorld.decompose(this.tp,this.tq,this.ts);
    if(!this.has){ this.p.copy(this.tp); this.q.copy(this.tq); this.s.copy(this.ts); this.has=true; this.stableMs=0; }
    // movement measured on screen (pixels) so it behaves the same near and far
    this.pv.copy(this.tp).project(cam); const sx=(this.pv.x+1)/2*innerWidth, sy=(1-this.pv.y)/2*innerHeight;
    const d=this.lastScr?Math.hypot(sx-this.lastScr[0],sy-this.lastScr[1]):0; this.lastScr=[sx,sy];
    const a=Math.min(.75,Math.max(.07,d/40));
    this.p.lerp(this.tp,a); this.q.slerp(this.tq,a); this.s.lerp(this.ts,a);
    this.stableMs+=dt; if(this.stableMs>100) this.el.object3D.visible=true;
    const o=this.el.object3D; o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s); }
});
AFRAME.registerComponent('sp-yt',{schema:{ov:{type:'string'},ratio:{default:1}},
  init(){ this.v=new THREE.Vector3(); this.pts=[[-.5,-this.data.ratio/2],[.5,-this.data.ratio/2],[.5,this.data.ratio/2],[-.5,this.data.ratio/2]]; this.on=false; this.sx=null; this.lostAt=0;
    this.el.addEventListener('targetFound',()=>{this.on=true;}); this.el.addEventListener('targetLost',()=>{this.on=false; this.lostAt=performance.now();}); },
  tick(t){ const o=document.getElementById(this.data.ov); if(!o) return;
    if(!this.on){ if(this.sx!==null && t-this.lostAt>0){ o.style.display='none'; this.sx=null; } return; }
    const cam=this.el.sceneEl.camera; if(!cam) return;
    const W=innerWidth,H=innerHeight; let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(const [x,y] of this.pts){ this.v.set(x,y,0); this.el.object3D.localToWorld(this.v); this.v.project(cam); const sx=(this.v.x+1)/2*W, sy=(1-this.v.y)/2*H; minx=Math.min(minx,sx);maxx=Math.max(maxx,sx);miny=Math.min(miny,sy);maxy=Math.max(maxy,sy); }
    const tw=Math.max(140,Math.min(W-20,maxx-minx)), tx=(minx+maxx)/2, ty=(miny+maxy)/2;
    if(this.sx===null){ this.sx=tx; this.sy=ty; this.sw=tw; }
    else { // adaptive smoothing: tiny jitter -> heavy smoothing, real movement -> quick follow
      const d=Math.hypot(tx-this.sx,ty-this.sy); const a=Math.min(.6,Math.max(.06,d/60)); this.sx+=(tx-this.sx)*a; this.sy+=(ty-this.sy)*a; this.sw+=(tw-this.sw)*Math.min(.4,Math.max(.05,Math.abs(tw-this.sw)/80)); }
    const bw=Math.round(this.sw), bh=Math.round(bw*9/16);
    o.style.display='block'; o.style.width=bw+'px'; o.style.height=bh+'px'; o.style.transform=`translate3d(${Math.round(this.sx-bw/2)}px,${Math.round(this.sy-bh/2)}px,0)`; }
});

function ytPlayer(ovId, vid, muted){ return new Promise(res=>{ const mk=()=>{ if(!window.YT||!YT.Player){ setTimeout(mk,150); return; }
  const p=new YT.Player(ovId+'_f',{videoId:vid,playerVars:{autoplay:0,controls:0,rel:0,modestbranding:1,playsinline:1,loop:1,playlist:vid,mute:muted?1:0},events:{onReady:()=>res(p)}}); }; mk(); }); }

const code=(new URLSearchParams(location.search).get('c')||'').replace(/[^a-z0-9]/g,'');
const $=s=>document.querySelector(s);
function fail(m){ $('#intro').classList.add('hide'); $('#errMsg').textContent=m; $('#errOv').classList.remove('hide'); }

async function init(){
  if(!code) return fail('This link is missing an account code.');
  const r=await fetch(`api.php?action=get&c=${code}`).then(x=>x.json()).catch(()=>({ok:false,error:'Network error'}));
  if(!r.ok) return fail(r.error||'Account not found');
  if(!r.items.length) return fail('This account has no pictures yet.');
  document.title=r.name;
  const b=$('#brand');
  if(r.logo){ b.innerHTML=`<img src="${r.logo}" alt="">`; b.href='#'; b.onclick=e=>e.preventDefault(); b.style.display='flex'; }
  else if(r.watermark){ b.textContent='Made with ScanPlay · Free'; b.classList.add('wm'); b.style.display='flex'; }
  start(r);
}

// Size + texture mapping of the video plane relative to the target (width 1, height R)
function fit(R,VR,mode){
  if(mode==='fit')     return VR>R ? {w:R/VR,h:R,rep:'1 1',off:'0 0'} : {w:1,h:VR,rep:'1 1',off:'0 0'};
  if(mode==='stretch') return {w:1,h:R,rep:'1 1',off:'0 0'};
  // fill: plane = target, crop the video texture to cover
  if(VR>R){ const k=R/VR; return {w:1,h:R,rep:`1 ${k.toFixed(4)}`,off:`0 ${((1-k)/2).toFixed(4)}`}; }
  const k=VR/R;          return {w:1,h:R,rep:`${k.toFixed(4)} 1`,off:`${((1-k)/2).toFixed(4)} 0`};
}

/* Tracking filter settings (tracker's built-in one-euro filter). ?tune=1 shows a live panel; values persist on this phone. */
const T=Object.assign({cf:0.001,beta:1,miss:2,warm:2}, JSON.parse(localStorage.getItem('sp_tune')||'{}'));
const TUNE=new URLSearchParams(location.search).get('tune')==='1';
function start(acc){
  const assets=acc.items.map((it,i)=>it.yt?'':`<video id="v${i}" src="${it.video}" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>`).join('');
  acc.items.forEach((it,i)=>{ if(it.yt){ const d=document.createElement('div'); d.className='ytov'; d.id='yt'+i; d.innerHTML=`<div id="yt${i}_f"></div>`; document.body.appendChild(d); } });
  const targets=acc.items.map((it,i)=>{ if(it.yt) return `<a-entity mindar-image-target="targetIndex: ${i}" data-i="${i}" sp-yt="ov: yt${i}; ratio: ${it.ratio}"></a-entity>`; const f=fit(it.ratio,it.vratio||it.ratio,it.fit||'fit'); return `
      <a-entity mindar-image-target="targetIndex: ${i}" data-i="${i}" id="t${i}"></a-entity>
      <a-entity sp-stable="target: #t${i}"><a-video src="#v${i}" width="${f.w}" height="${f.h}" position="0 0 0" material="repeat: ${f.rep}; offset: ${f.off}"></a-video></a-entity>`; }).join('');

  $('#scene').innerHTML=`
    <a-scene mindar-image="imageTargetSrc: ${acc.mind}?v=${Date.now()}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: ${T.cf}; filterBeta: ${T.beta}; missTolerance: ${T.miss}; warmupTolerance: ${T.warm}; maxTrack: 1"
             color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
      <a-assets>${assets}</a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      ${targets}
    </a-scene>`;

  const scene=$('a-scene'), hint=$('#hint'), snd=$('#snd');
  const vids=acc.items.map((it,i)=>it.yt?null:$('#v'+i)); const yts={}; acc.items.forEach((it,i)=>{ if(it.yt) ytPlayer('yt'+i,it.yt,true).then(p=>{yts[i]=p;}); });
  vids.forEach(v=>{ if(v) v.muted=true; });
  snd.style.display='block';
  document.addEventListener('pointerdown',()=>{ vids.forEach(v=>{ if(v) v.muted=false; }); Object.values(yts).forEach(p=>{ try{p.unMute();}catch(e){} }); snd.style.display='none'; },{once:true});

  document.querySelectorAll('[mindar-image-target]').forEach(t=>{
    const i=+t.dataset.i;
    t.addEventListener('targetFound',()=>{ hint.classList.add('found'); hint.lastElementChild.textContent=acc.items[i].title; vids.forEach((v,j)=>{ if(v&&j!==i) v.pause(); }); Object.entries(yts).forEach(([j,p])=>{ if(+j!==i) try{p.pauseVideo();}catch(e){} }); if(vids[i]) vids[i].play().catch(()=>{}); else if(yts[i]) try{yts[i].playVideo();}catch(e){} });
    let lostT; t.addEventListener('targetLost', ()=>{ hint.classList.remove('found'); hint.lastElementChild.textContent='Point at the picture'; clearTimeout(lostT); lostT=setTimeout(()=>{ if(vids[i]) vids[i].pause(); else if(yts[i]) try{yts[i].pauseVideo();}catch(e){} },0); });
    t.addEventListener('targetFound',()=>clearTimeout(lostT));
  });
  scene.addEventListener('arReady',()=>{ $('#intro').classList.add('hide'); hint.style.display='flex'; if(TUNE) tunePanel(); });
  scene.addEventListener('arError',ev=>fail('Camera could not start. Check permissions and that you are on HTTPS. '+(ev.detail?.error||'')));
}
function tunePanel(){
  const p=document.createElement('div'); p.style.cssText='position:fixed;left:10px;right:10px;bottom:70px;z-index:8;background:rgba(16,20,24,.88);color:#fff;padding:10px;border-radius:12px;font:12px Inter';
  const row=(k,label,min,max,step)=>`<label style="display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;margin:4px 0">${label}<input type="range" min="${min}" max="${max}" step="${step}" value="${T[k]}" oninput="T.${k}=+this.value;this.nextElementSibling.textContent=this.value;localStorage.setItem('sp_tune',JSON.stringify(T))"><span>${T[k]}</span></label>`;
  p.innerHTML='<b>Tracking tune</b> — move slider, then Apply'+row('cf','Steady at rest (cf)',0.00001,0.005,0.00001)+row('beta','Follow speed (beta)',0.01,5,0.01)+row('miss','Miss tolerance',1,40,1)+row('warm','Warm-up frames',1,10,1)+
    '<div style="display:flex;gap:8px;margin-top:6px"><button onclick="location.reload()" style="flex:1;padding:8px;border:0;border-radius:8px;background:#7C3AED;color:#fff;font-weight:700">Apply (reload)</button><button onclick="localStorage.removeItem(\'sp_tune\');location.reload()" style="padding:8px;border:0;border-radius:8px;background:#444;color:#fff">Reset</button></div>';
  document.body.appendChild(p);
}
init();
</script>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toUpperCase();
  if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'))||(e.ctrlKey&&(k==='U'||k==='S'))){ e.preventDefault(); e.stopPropagation(); }
},true);
</script>
</body>
</html>
