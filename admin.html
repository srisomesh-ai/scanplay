<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScanPlay Admin</title>
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/scanplay-logo.svg"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F0A1F;--paper:#F6F3FF;--line:#ECE8F8;--mute:#4B4661;--b:#7C3AED;--a:#FF4D6D;--red:#E4462B;--grad:linear-gradient(135deg,#7C3AED,#FF4D6D)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',system-ui;background:#fff;color:var(--ink);padding:0 0 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}
header h1{font-size:18px} header h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{max-width:1200px;margin:auto;padding:16px 20px}
input,select{font:500 14px 'Plus Jakarta Sans';padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.btn{font:700 13px 'Plus Jakarta Sans';padding:9px 14px;border:0;border-radius:10px;background:var(--grad);color:#fff;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--line)} .btn.d{background:#fff;color:var(--red);border:1.5px solid #FAD9D3}
.btn.s{padding:6px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--paper);border-radius:14px;padding:14px} .kpi b{font-size:24px;display:block} .kpi span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
tr.u{cursor:pointer}tr.u:hover{background:var(--paper)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}.tag.a{background:#E8F9EE;color:#15803D}.tag.g{background:#FFF4E5;color:#B45309}.tag.x{background:#FEE2E2;color:#B91C1C}.tag.p{background:var(--paper);color:var(--b)}
.modal{position:fixed;inset:0;background:rgba(15,10,31,.5);display:none;align-items:flex-start;justify-content:center;padding:12px;overflow:auto;z-index:9;-webkit-overflow-scrolling:touch}.modal.open{display:flex}
.box{background:#fff;border-radius:20px;padding:22px;max-width:860px;width:100%;position:relative}
.box>.row:first-child{position:sticky;top:-22px;background:#fff;padding:8px 0;z-index:2}
.box h2{font-size:18px;margin-bottom:4px} .box h3{font-size:14px;margin:18px 0 8px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.field{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.item img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.st{font-size:12px;color:var(--mute);margin-top:6px;min-height:16px}.st.err{color:var(--red)}
#login{max-width:360px;margin:80px auto;padding:20px}
</style>
<style>.agr{font:500 14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:#141032;text-align:left}
.agr-head{text-align:center;margin-bottom:18px}.agr-head img{width:150px;display:block;margin:0 auto 8px}.agr-head h1{font-size:22px;margin:0 0 2px;letter-spacing:.02em}
.agr h2{font-size:14px;color:#7C3AED;margin:18px 0 6px}.agr p{margin:0 0 8px}.agr ul{margin:0 0 8px 20px;padding:0}.agr li{margin:0 0 5px}
.agr-tbl{border-collapse:collapse;width:100%;margin:6px 0 8px;font-size:13px}.agr-tbl th,.agr-tbl td{border:1px solid #E8E4F4;padding:7px 10px;text-align:left}.agr-tbl th{background:#F3EEFF}
.agr-note{font-size:12px;color:#5B5670}.agr-sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px}.agr-sig>div{font-size:13px}

function applyTpl(){ const t=TPL[$('#btpl').value]; if(!t) return; $('#bsub').value=t.s; $('#bbody').value=t.b; $('#bst').textContent='Template loaded — edit if needed, then send.'; }
async function broadcast(){ const seg=$('#bseg').value; if(!confirm('Send this email to '+$('#bseg').selectedOptions[0].text+'?')) return; $('#bst').textContent='Sending…'; const r=await api('admin_broadcast',{segment:seg,subject:$('#bsub').value,body:$('#bbody').value}); $('#bst').textContent=r.ok?`Sent to ${r.sent} of ${r.total} users`:r.error; }
async function loadPromos(){ const r=await api('admin_promos'); if(!r.ok) return; 
  $('#pt').innerHTML='<tr><th>Code</th><th>Discount</th><th>Uses</th><th>Expires</th><th>Sales</th><th>Revenue</th><th>Discount given</th><th>Note</th><th></th></tr>'+(r.promos.map(p=>`<tr><td><b>${p.code}</b> ${p.active?'':'<span class="tag x">off</span>'}</td><td>${p.percent?p.percent+'%':''}${p.flat?' ₹'+p.flat:''}</td><td>${p.uses}${p.max_uses?' / '+p.max_uses:''}</td><td>${p.expires?d(p.expires):'—'}</td><td>${p.paid_count||0}</td><td>${inr((p.revenue||0)/100)}</td><td>${inr((p.given||0)/100)}</td><td style="max-width:180px">${p.note||''}</td>
    <td class="row"><button class="btn g s" onclick="api('admin_promo_toggle',{code:'${p.code}',active:${p.active?0:1}}).then(loadPromos)">${p.active?'Disable':'Enable'}</button><button class="btn d s" onclick="if(confirm('Delete ${p.code}?'))api('admin_promo_delete',{code:'${p.code}'}).then(loadPromos)">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="st">No promo codes yet</td></tr>');
  $('#pst').innerHTML=r.sales.length?'<b>Recent promo sales:</b> '+r.sales.slice(0,20).map(s=>`${d(s.created)} ${s.promo} · ${s.name} · ${s.plan}/${s.period} · paid ${inr(s.amount/100)} (saved ${inr(s.discount/100)})`).join('<br>'):''; }
async function savePromo(){ const r=await api('admin_promo_save',{code:$('#pcode').value,percent:$('#ppct').value||0,flat:$('#pflat').value||0,max_uses:$('#pmax').value||0,expires:$('#pexp').value,note:$('#pnote').value}); if(!r.ok) return alert(r.error); $('#pcode').value='';$('#pnote').value='';  }
async function backup(){ const fd=new FormData(); const r=await fetch('api.php?action=admin_backup',{method:'POST',body:fd,headers:{'X-Admin-Pass':P}}); if(!r.ok){alert('Backup failed');return;} const b=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='scanplay-backup-'+new Date().toISOString().slice(0,10)+'.zip'; a.click(); }
async function api(a,f={}){const fd=new FormData();Object.entries(f).forEach(([k,v])=>fd.append(k,v));return (await fetch('api.php?action='+a,{method:'POST',body:fd,headers:{'X-Admin-Pass':P}})).json();}
const d=t=>new Date(t*1000).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});
const e=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
async function load(){ if(!P) P=$('#p').value; const r=await api('admin_users'); if(!r.ok){ $('#lerr').textContent=r.error; P=''; return; } sessionStorage.setItem('sp_admin',P);
  DATA=r; $('#login').style.display='none'; $('#app').style.display=''; $('#out').style.display='';
  const t=r.totals; $('#kpis').innerHTML=`<div class="kpi"><b>${t.users}</b><span>Users</span></div><div class="kpi"><b>${DATA.users.filter(u=>u.role==='distributor').length} / ${DATA.users.filter(u=>u.role==='promoter').length}</b><span>Distributors / Promoters</span></div><div class="kpi"><b>${DATA.users.reduce((n,u)=>n+(+u.tokens||0),0)}</b><span>Tokens in circulation</span></div><div class="kpi"><b>${DATA.users.reduce((n,u)=>n+(+u.tokens_used||0),0)}</b><span>Tokens used</span></div><div class="kpi"><b>${t.scans30}</b><span>Scans, 30 days</span></div><div class="kpi"><b>${t.photos}</b><span>Photos stored</span></div><div class="kpi" style="${t.integrity==='ok'?'':'background:#FEE2E2'}"><b>${t.integrity==='ok'?'OK':'CHECK'}</b><span>Database integrity</span></div><div class="kpi"><b>${t.backups}</b><span>Daily backups kept<br>${t.lastBackup}</span></div>`;
  DATA.users.forEach(u=>PN[u.id]=u.business||u.name||u.email); render(); loadActivity(); loadSettings(); loadAgreements(); }
function render(){ const q=$('#q').value.toLowerCase(), f=$('#f').value;
  $('#tb').innerHTML=DATA.users.filter(u=>(!q||[u.name,u.email,u.phone].join(' ').toLowerCase().includes(q))&&(!f||(u.role||'user')===f)).map(u=>`<tr class="u" onclick="openUser(${u.id})">
    <td><b>${u.name||''}</b><br><span style="color:var(--mute)">${e(u.email)}${u.phone?' · '+u.phone:''}</span>${u.verified?'':' <span class="tag x">unverified</span>'}${u.note?'<br><span style="font-size:11px;color:var(--b)">📝 '+u.note+'</span>':''}</td>
    <td><span class="tag p">${u.role||'user'}</span>${u.parent_id?'<br><span style="font-size:11px;color:var(--mute)">under '+(PN[u.parent_id]||'#'+u.parent_id)+'</span>':'<br><span style="font-size:11px;color:var(--mute)">direct</span>'}</td><td><b>${u.tokens||0}</b> left<br><span style="font-size:11px;color:var(--mute)">${u.tokens_used||0} used</span></td>
    <td>${u.accs} proj · ${u.photos} photos</td><td>${u.scans||0}</td><td>${d(u.created)}</td></tr>`).join(''); }
const PN={};
async function openUser(id){ try{ const r=await api('admin_user',{id}); if(!r.ok) return alert(r.error); const u=r.user, i=r.info, L=i.limits, opts=Object.keys(DATA.plans).map(k=>`<option value="${k}" ${u.plan===k?'selected':''}>${DATA.plans[k].name}</option>`).join('');
  $('#mb').innerHTML=`
  <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
    <div><h2 style="margin:0">${e(u.name)}</h2><div style="color:var(--mute);font-size:13px;margin-top:2px">${e(u.email)} · ${u.phone||'no phone'} · joined ${d(u.created)}${u.google_id?' · Google':''}</div></div>
    <span class="row" style="gap:6px">${u.verified?'':`<button class="btn g s" onclick="act('admin_verify',{id:${id}})">Mark verified</button>`}<button class="btn g s" onclick="const p=prompt('New password (min 6)');if(p)act('admin_setpass',{id:${id},pass:p})">Set password</button><button class="btn d s" onclick="if(confirm('Delete this user and ALL their projects, photos and videos? Cannot be undone.'))act('admin_user_delete',{id:${id}},true)">Delete user</button><button class="btn g s" onclick="closeUser()">Close</button></span>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
    <div class="card" style="margin:0">
      <h3 style="margin:0 0 6px">Tokens</h3>
      <div class="st" style="margin-bottom:10px"><b>${u.tokens||0}</b> left · ${u.tokens_used||0} used · ${i.used.accounts} projects, ${i.used.photos} photos</div>
      <div class="row" style="gap:6px;flex-wrap:wrap"><input id="tk" type="number" value="50" style="width:80px"><input id="tkn" placeholder="note (invoice no, cash…)" style="flex:1;min-width:120px"><button class="btn s" onclick="tokAct(${id},1)">Add</button><button class="btn d s" onclick="tokAct(${id},-1)">Remove</button></div>
      <div class="st" style="margin-top:8px;font-size:12px">Only admin can remove tokens. Partners can only give tokens downward.</div>
    </div>
    <div class="card" style="margin:0">
      <h3 style="margin:0 0 6px">Role &amp; parent</h3>
      <div class="st" style="margin-bottom:10px">Parent: ${r.parent?`<b>${e(r.parent.name)}</b> (${e(r.parent.role)}) · ${e(r.parent.email)}`:'<b>ScanPlay (direct)</b>'}${u.business?' · Business: '+u.business:''}${u.area?' · '+u.area:''}${['distributor','promoter'].includes(u.role)?(u.listed?' · <span class="tag a">on website</span>':' · not on website'):''}${u.lat?' · 📍 '+(u.address||u.lat+','+u.lng):(['distributor','promoter'].includes(u.role)?' · <span class="tag x">no map pin</span>':'')}</div>
      <div class="row" style="gap:6px;flex-wrap:wrap"><select id="rl"><option value="distributor" ${u.role==='distributor'?'selected':''}>Distributor</option><option value="promoter" ${u.role==='promoter'?'selected':''}>Promoter</option><option value="user" ${(u.role||'user')==='user'?'selected':''}>User</option></select><input id="pe" placeholder="parent email (blank = direct under ScanPlay)" value="${r.parent?r.parent.email:''}" style="flex:1;min-width:160px"><button class="btn s" onclick="act('admin_role',{id:${id},role:$('#rl').value,parent_email:$('#pe').value})">Save</button></div>
      <div class="row" style="gap:6px;margin-top:8px"><input id="nt" value="${(u.note||'').replace(/"/g,'&quot;')}" style="flex:1" placeholder="Admin note"><button class="btn g s" onclick="act('admin_credit',{id:${id},note:$('#nt').value})">Save note</button></div>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3 style="margin:0 0 6px">Token history</h3>
    ${r.ledger&&r.ledger.length?r.ledger.slice(0,30).map(l=>`<div class="st">${d(l.ts)} · ${l.kind==='spent'?'used on photo '+(l.note||''):l.kind==='grant'?'+'+l.qty+' from ScanPlay':l.kind==='remove'?'−'+l.qty+' removed by ScanPlay':(l.from_id==u.id?'−'+l.qty+' to '+(l.tname||'?'):'+'+l.qty+' from '+(l.fname||'?'))}${l.note&&l.kind!=='spent'?' · '+l.note:''}</div>`).join(''):'<div class="st">No token movements yet</div>'}
  </div>
  <div class="card" style="margin-top:12px">
    <h3 style="margin:0 0 6px">Payments</h3>
    ${r.payments.length?r.payments.map(p=>`<div class="st">${d(p.created)} · ${p.plan} ${p.period} · ${inr(p.amount/100)} · <b>${p.status}</b>${p.payment_id?' · '+p.payment_id:''}</div>`).join(''):'<div class="st">None</div>'}
    <h3 style="cursor:pointer;margin:12px 0 4px" onclick="const b=$('#uAct');const o=b.style.display==='none';b.style.display=o?'':'none';$('#uActA').textContent=o?'▾ hide':'▸ show'">Activity <span id="uActA" style="font-weight:400;color:var(--mute);font-size:13px">▸ show</span></h3>
    <div id="uAct" style="display:none;font-size:12px;max-height:260px;overflow-y:auto;word-break:break-word">${(r.activity||[]).map(actLine).join('')||'<div class="st">None</div>'}</div>
  </div>
  <h3>Projects &amp; photos</h3>${r.accounts.length?r.accounts.map(a=>`<div class="card"><div class="row" style="justify-content:space-between"><div><b>${e(a.name)}</b> ${a.blocked?'<span class="tag x">BLOCKED</span>':''}${a.showcase?'<span class="tag" style="background:#FFB86C33;color:#B45309">HOMEPAGE</span>':''} <span style="color:var(--mute);font-size:12px">${e(a.code)} · ${a.scans} scans</span><br><a href="${a.qrUrl}" target="_blank" style="font-size:12px;color:var(--b)">${a.qrUrl}</a></div><span class="row"><button class="btn g s" onclick="act('admin_showcase',{code:'${e(a.code)}',showcase:${a.showcase?0:1}},false,${id})">${a.showcase?'★ On homepage':'☆ Show on homepage'}</button><button class="btn g s" onclick="act('admin_block',{code:'${e(a.code)}',blocked:${a.blocked?0:1}},false,${id})">${a.blocked?'Unblock':'Block'}</button><button class="btn d s" onclick="if(confirm('Delete project ${e(a.name)}?'))act('admin_account_delete',{code:'${e(a.code)}'},false,${id})">Delete project</button></span></div>
    ${a.items.map(it=>`<div class="item"><img src="${it.thumb}"><div><b>${e(it.title)}</b> <span style="font-size:12px;font-weight:700;color:var(--b)">👁 ${it.hits||0}</span><div style="font-size:12px;color:var(--mute)">${e(it.id)} · fit: ${it.fit||'fit'} · <a href="data/${e(a.code)}/${e(it.id)}/video.mp4" target="_blank" style="color:var(--b)">video</a></div></div><button class="btn d s" onclick="if(confirm('Remove this photo?'))act('admin_item_delete',{code:'${e(a.code)}',id:'${e(it.id)}'},false,${id})">Remove</button></div>`).join('')||'<div class="st">No photos</div>'}</div>`).join(''):'<div class="st">No projects</div>'}
  <div class="st" id="mst"></div>`; $('#m').classList.add('open'); }catch(e){ $('#mb').innerHTML=`<div class="row" style="justify-content:space-between"><h2>Could not open user</h2><button class="btn g s" onclick="closeUser()">Close</button></div><p class="st err">${e.message}</p><p class="st">Redeploy from hPanel Git and hard-refresh; if it persists, send this message to support.</p>`; $('#m').classList.add('open'); } }
/* ---------- agreements ---------- */
let AGR_SIG=null;
async function loadAgreements(){ const r=await api('admin_agreements'); if(!r.ok) return; const L=r.agreements||[];
  $('#agrList').innerHTML=L.length?L.map(g=>`<div class="st" style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><div><b>${e(g.business||g.name)}</b> <span class="tag p">${e(g.role)}</span> · ${e(g.id)} · ${d(g.created)}<br><span class="tag ${g.status==='signed'?'a':'g'}">${g.status==='signed'?'signed '+d(g.signed_at)+' ('+e(g.sign_kind)+')':'awaiting signature'}</span>${g.admin_signed_at?' <span class="tag a">ScanPlay signed</span>':' <span class="tag g">ScanPlay not signed</span>'}</div>
    <div class="row" style="gap:4px"><button class="btn g s" onclick="agrView('${e(g.id)}')">View</button><a class="btn g s" href="agreement.html?id=${e(g.id)}" target="_blank">PDF</a>${g.status!=='signed'?`<button class="btn d s" onclick="if(confirm('Delete this agreement?'))api('admin_agreement_delete',{id:'${e(g.id)}'}).then(loadAgreements)">✕</button>`:''}</div></div>`).join('')
  :'<div class="st">No agreements yet.</div>'; }
function agrNew(){ const users=DATA.users.filter(u=>['distributor','promoter'].includes(u.role)); const D=AGR_DEFAULTS;
  $('#agrBody').innerHTML=`<h3 style="margin:0 0 10px">New agreement</h3>
    <div class="row" style="flex-wrap:wrap;gap:8px"><select id="agU" style="flex:1;min-width:200px"><option value="">Choose partner…</option>${users.map(u=>`<option value="${u.id}" data-role="${e(u.role)}" data-area="${e(u.area||u.address||'')}">${e(u.business||u.name)} — ${e(u.role)} (${e(u.email)})</option>`).join('')}</select>
    <input id="agT" placeholder="Territory / area, e.g. Visakhapatnam District, Andhra Pradesh" style="flex:2;min-width:220px"></div>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">
      <label class="st">Promo price ₹ <input id="agPP" type="number" value="${D.promoPrice}" style="width:70px"></label>
      <label class="st">for first <input id="agPQ" type="number" value="${D.promoQty}" style="width:80px"> tokens</label>
      <label class="st">Standard price ₹ <input id="agSP" type="number" value="${D.stdPrice}" style="width:70px"></label>
      <label class="st">Min first order <input id="agMF" type="number" value="${D.minFirst}" style="width:80px"></label>
      <label class="st">Min reorder <input id="agMR" type="number" value="${D.minReorder}" style="width:80px"></label></div>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">
      <label class="st">Monthly circulation — M1 <input id="agM1" type="number" value="${D.m1}" style="width:80px"></label>
      <label class="st">M2 <input id="agM2" type="number" value="${D.m2}" style="width:80px"></label>
      <label class="st">M3+ <input id="agM3" type="number" value="${D.m3}" style="width:80px"></label>
      <label class="st" id="agPromRow">Active promoters <input id="agPN" type="number" value="${D.promoters}" style="width:60px"> within <input id="agPD" type="number" value="${D.promoterDays}" style="width:60px"> days</label></div>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">
      <label class="st">Recommended promoter price ₹ <input id="agRP" value="${D.recPromoterPrice}" style="width:70px"></label>
      <label class="st">Max promoter price ₹ <input id="agXP" type="number" value="${D.maxPromoterPrice}" style="width:70px"></label>
      <label class="st">Term <input id="agTM" type="number" value="${D.termMonths}" style="width:55px"> months</label>
      <label class="st">Notice <input id="agND" type="number" value="${D.noticeDays}" style="width:55px"> days</label></div>
    <textarea id="agN" rows="2" placeholder="Additional terms (optional)" style="width:100%;margin-top:8px;font:500 13px 'Plus Jakarta Sans';padding:8px;border:1.5px solid var(--line);border-radius:10px"></textarea>
    <div class="st" style="margin-top:10px"><b>ScanPlay signature</b> (draw with finger/mouse — optional now, can sign later)</div>
    <canvas id="agSig" style="width:100%;height:110px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none"></canvas>
    <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn g s" onclick="AGR_SIG.clear()">Clear signature</button><div class="row"><button class="btn g s" onclick="agrPreview()">Preview</button><button class="btn s" onclick="agrSend()">Send to partner</button></div></div>
    <div id="agPrev" style="margin-top:12px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px;display:none"></div>`;
  $('#agU').onchange=function(){ const o=this.selectedOptions[0]; if(!o) return; if(!$('#agT').value) $('#agT').value=o.dataset.area||''; $('#agPromRow').style.display=o.dataset.role==='promoter'?'none':''; };
  $('#agrModal').classList.add('open'); setTimeout(()=>{ AGR_SIG=sigPad($('#agSig')); },60); }
function agrTerms(){ const o=$('#agU').selectedOptions[0]; return {role:o?o.dataset.role:'distributor',territory:$('#agT').value,promoPrice:+$('#agPP').value,promoQty:+$('#agPQ').value,stdPrice:+$('#agSP').value,minFirst:+$('#agMF').value,minReorder:+$('#agMR').value,m1:+$('#agM1').value,m2:+$('#agM2').value,m3:+$('#agM3').value,promoters:+$('#agPN').value,promoterDays:+$('#agPD').value,recPromoterPrice:$('#agRP').value,maxPromoterPrice:+$('#agXP').value,termMonths:+$('#agTM').value,noticeDays:+$('#agND').value,retentionMonths:12,notes:$('#agN').value}; }
function agrPreview(){ const o=$('#agU').selectedOptions[0]; if(!o||!o.value){ alert('Choose a partner'); return; } const u=DATA.users.find(x=>x.id==o.value); const t=agrTerms(); t.number='(preview)'; t.date=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}); t.party={name:u.business||u.name,person:u.name,address:u.address||u.area,email:u.email,phone:u.phone,role:u.role}; t.scanplay={name:$('#sa_name').value,business:$('#sa_biz').value};
  const p=$('#agPrev'); p.style.display=''; p.innerHTML=agreementHtml({terms:t,status:'sent',admin_img:AGR_SIG&&!AGR_SIG.isEmpty()?AGR_SIG.data():null}); }
async function agrSend(){ const o=$('#agU').selectedOptions[0]; if(!o||!o.value){ alert('Choose a partner'); return; } if(!$('#agT').value.trim()){ alert('Enter the territory / area'); return; }
  const r=await api('admin_agreement_create',{user_id:o.value,terms:JSON.stringify(agrTerms()),admin_sign:AGR_SIG&&!AGR_SIG.isEmpty()?AGR_SIG.data():''}); if(!r.ok){ alert(r.error); return; } agrClose(); loadAgreements(); alert('Agreement sent. The partner will see it in their Partner panel and by email.'); }
async function agrView(id){ const r=await api('agreement_get',{id}); if(!r.ok){ alert(r.error); return; } const g=r.agreement;
  $('#agrBody').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Agreement ${e(g.id)}</h3><div class="row" style="gap:6px"><a class="btn g s" href="agreement.html?id=${e(g.id)}" target="_blank">Open / PDF</a><button class="btn g s" onclick="agrClose()">Close</button></div></div>
    <div style="max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px">${agreementHtml(g)}</div>
    ${g.admin_signed_at?'':`<div class="st" style="margin-top:10px"><b>Sign for ScanPlay</b></div><canvas id="agSig2" style="width:100%;height:110px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none"></canvas><div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn g s" onclick="AGR_SIG.clear()">Clear</button><button class="btn s" onclick="agrAdminSign('${e(g.id)}')">Save ScanPlay signature</button></div>`}`;
  $('#agrModal').classList.add('open'); if(!g.admin_signed_at) setTimeout(()=>{ AGR_SIG=sigPad($('#agSig2')); },60); }
async function agrAdminSign(id){ if(!AGR_SIG||AGR_SIG.isEmpty()){ alert('Draw the signature first'); return; } const r=await api('admin_agreement_sign',{id,sign:AGR_SIG.data()}); if(!r.ok){ alert(r.error); return; } loadAgreements(); agrView(id); }
function agrClose(){ $('#agrModal').classList.remove('open'); }
function tokAct(id,sign){ const u=DATA.users.find(x=>x.id==id)||{}; const n=Math.abs(parseInt($('#tk').value,10)||0); if(!n){ alert('Enter how many tokens'); return; }
  const msg=sign>0?`Add ${n} tokens to ${e(u.name||u.email)}? They will be notified by email.`:`Remove ${n} tokens from ${e(u.name||u.email)}? They currently have ${u.tokens||0}.`;
  if(confirm(msg)) act('admin_tokens',{id:id,delta:sign*n,note:$('#tkn').value}); }
async function loadSettings(){ const r=await api('admin_settings',{}); if(!r.ok) return; const v=r.settings; $('#sa_name').value=v.name||''; $('#sa_biz').value=v.business||''; $('#sa_phone').value=v.phone||''; $('#sa_wa').value=v.whatsapp||''; $('#sa_email').value=v.email||''; $('#sa_pay').value=v.pay_details||''; }
async function saveSettings(){ const r=await api('admin_settings',{save:1,admin_name:$('#sa_name').value,admin_business:$('#sa_biz').value,admin_phone:$('#sa_phone').value,admin_whatsapp:$('#sa_wa').value,admin_email:$('#sa_email').value,admin_pay:$('#sa_pay').value}); $('#sast').textContent=r.ok?'Saved':r.error; }
async function loadLedger(){ const r=await api('admin_ledger',{}); if(!r.ok) return alert(r.error); $('#ledger').innerHTML=r.ledger.map(l=>`<div class="st">${d(l.ts)} · <b>${l.qty}</b> · ${l.kind} · ${l.from_id?(l.fname||'#'+l.from_id):'ScanPlay'} → ${l.to_id?(l.tname||'#'+l.to_id):(l.kind==='spent'?'photo':'ScanPlay')}${l.note?' · '+l.note:''}</div>`).join('')||'<div class="st">Empty</div>'; }
async function act(a,f,closeAfter,reopen){ const r=await api(a,f); if(!r.ok) return alert(r.error); if(r.note) alert(r.note); await load(); if(closeAfter) closeUser(); else openUser(reopen||f.id); }
function closeUser(){ $('#m').classList.remove('open'); $('#mb').innerHTML=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeUser(); });
if(P) load();
</script></body></html>
